<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>렌더링 품질 비교 실험 — Fresnel-Guided PT</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #eee; }

/* ── 설정 화면 ── */
#setup-screen {
  max-width: 700px; margin: 60px auto; padding: 40px;
  background: #2a2a2a; border-radius: 12px;
}
#setup-screen h1 { font-size: 1.4rem; margin-bottom: 8px; }
#setup-screen p  { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
.pair-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.pair-row input[type=file] { flex: 1; background: #333; border: 1px solid #555;
  border-radius: 6px; padding: 6px 10px; color: #eee; font-size: 0.85rem; }
.pair-row label { width: 80px; font-size: 0.85rem; color: #aaa; flex-shrink: 0; }
.pair-row span  { width: 16px; text-align: center; color: #666; }
button { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 0.95rem; font-weight: 600; }
#add-pair-btn  { background: #3a3a3a; color: #ccc; margin-bottom: 20px; }
#start-btn     { background: #4a7cf7; color: #fff; width: 100%; padding: 14px; font-size: 1rem; }
#start-btn:disabled { background: #3a4a6a; color: #888; cursor: not-allowed; }
.hint { font-size: 0.78rem; color: #666; margin-top: 6px; }

/* ── 실험 화면 ── */
#trial-screen { display: none; }
#progress-bar-wrap { background: #2a2a2a; padding: 14px 30px; display: flex;
  align-items: center; gap: 16px; border-bottom: 1px solid #333; }
#progress-text { font-size: 0.85rem; color: #aaa; white-space: nowrap; }
#progress-bar  { flex: 1; height: 6px; background: #3a3a3a; border-radius: 3px; overflow: hidden; }
#progress-fill { height: 100%; background: #4a7cf7; border-radius: 3px;
  transition: width 0.3s ease; width: 0%; }

#trial-content { padding: 30px; }
#question-text { text-align: center; font-size: 1.1rem; margin-bottom: 24px; color: #ddd; }

#images-wrap { display: flex; gap: 24px; justify-content: center; }
.img-option { flex: 1; max-width: 580px; cursor: pointer; }
.img-option img { width: 100%; border-radius: 8px; border: 3px solid transparent;
  transition: border-color 0.15s, transform 0.1s; display: block; }
.img-option:hover img { border-color: #4a7cf7; transform: scale(1.005); }
.img-option.selected img { border-color: #4af77a; }
.img-label { text-align: center; margin-top: 10px; font-size: 1rem;
  font-weight: 700; color: #aaa; letter-spacing: 0.05em; }
.img-option.selected .img-label { color: #4af77a; }

#action-row { display: flex; justify-content: center; align-items: center;
  gap: 20px; margin-top: 28px; }
#next-btn { background: #4a7cf7; color: #fff; padding: 12px 40px;
  font-size: 1rem; border-radius: 8px; opacity: 0.4; pointer-events: none; }
#next-btn.ready { opacity: 1; pointer-events: auto; }
.confidence-wrap { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: #888; }
.conf-btn { background: #3a3a3a; color: #bbb; border: 1px solid #555;
  border-radius: 6px; padding: 6px 14px; font-size: 0.82rem; }
.conf-btn.active { background: #4a5a7a; color: #fff; border-color: #4a7cf7; }

/* ── 결과 화면 ── */
#result-screen { display: none; max-width: 700px; margin: 60px auto; padding: 40px;
  background: #2a2a2a; border-radius: 12px; }
#result-screen h2 { margin-bottom: 20px; }
#result-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 24px; }
#result-table th { background: #333; padding: 8px 12px; text-align: left; }
#result-table td { padding: 8px 12px; border-bottom: 1px solid #333; }
#summary-box { background: #1a2a3a; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
#summary-box h3 { margin-bottom: 12px; color: #7ab4f7; }
.stat-line { font-size: 1.2rem; margin-bottom: 8px; }
.stat-line span { font-weight: 700; color: #4af77a; }
#export-btn { background: #4a7cf7; color: #fff; }
#restart-btn { background: #3a3a3a; color: #ccc; margin-left: 12px; }
</style>
</head>
<body>

<!-- ── 설정 화면 ── -->
<div id="setup-screen">
  <h1>렌더링 품질 비교 실험</h1>
  <p>두 이미지를 보고 더 자연스럽게 표현된 쪽을 선택하는 실험입니다. (예상 소요: 5~10분)</p>

  <div style="margin-bottom:16px;font-size:0.85rem;color:#aaa;">
    ▶ 이미지 쌍을 추가하세요. 각 행에 <b>이미지 A</b>(Baseline)와 <b>이미지 B</b>(Fresnel-guided)를 지정합니다.
    <div class="hint">* 같은 씬의 다른 렌더링 결과(crop 권장) / 최소 6쌍 권장</div>
  </div>

  <div id="pairs-container"></div>
  <button id="add-pair-btn" onclick="addPair()">+ 이미지 쌍 추가</button>

  <div style="border-top:1px solid #444;margin:20px 0;padding-top:20px;">
    <label style="font-size:0.85rem;color:#aaa;display:block;margin-bottom:8px;">
      질문 문구 (직접 수정 가능)
    </label>
    <textarea id="question-input" rows="2"
      style="width:100%;background:#333;border:1px solid #555;border-radius:6px;
             padding:8px 12px;color:#eee;font-size:0.9rem;resize:vertical;"
    >두 이미지 중 유리·금속 경계의 반사와 굴절이 더 자연스럽게 표현된 것을 선택하세요.</textarea>
  </div>

  <button id="start-btn" disabled onclick="startStudy()">실험 시작</button>
</div>

<!-- ── 실험 화면 ── -->
<div id="trial-screen">
  <div id="progress-bar-wrap">
    <span id="progress-text">0 / 0</span>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>
  <div id="trial-content">
    <p id="question-text"></p>
    <div id="images-wrap">
      <div class="img-option" id="opt-left" onclick="selectOption('left')">
        <img id="img-left" src="" alt="이미지 A">
        <div class="img-label" id="label-left">A</div>
      </div>
      <div class="img-option" id="opt-right" onclick="selectOption('right')">
        <img id="img-right" src="" alt="이미지 B">
        <div class="img-label" id="label-right">B</div>
      </div>
    </div>
    <div id="action-row">
      <div class="confidence-wrap">
        확신도:
        <button class="conf-btn" onclick="setConf(1)">낮음</button>
        <button class="conf-btn" onclick="setConf(2)">보통</button>
        <button class="conf-btn" onclick="setConf(3)">높음</button>
      </div>
      <button id="next-btn" onclick="nextTrial()">다음 ▶</button>
    </div>
  </div>
</div>

<!-- ── 결과 화면 ── -->
<div id="result-screen">
  <h2>실험 완료 — 결과 요약</h2>
  <div id="summary-box">
    <h3>통계</h3>
    <div class="stat-line" id="stat-fresnel"></div>
    <div class="stat-line" id="stat-total"></div>
    <div class="stat-line" id="stat-pval"></div>
  </div>
  <table id="result-table">
    <thead>
      <tr><th>#</th><th>쌍</th><th>좌측</th><th>선택</th><th>정답(Fresnel=B)</th><th>확신도</th><th>반응시간(s)</th></tr>
    </thead>
    <tbody id="result-tbody"></tbody>
  </table>
  <button id="export-btn" onclick="exportCSV()">CSV 내보내기</button>
  <button id="restart-btn" onclick="location.reload()">처음부터</button>
</div>

<script>
// ── 상태 ──────────────────────────────────────────────────────────
let pairs    = [];   // [{urlA, urlB, nameA, nameB}]
let trials   = [];   // [{pairIdx, leftIsA, ...}] — counterbalanced
let results  = [];   // [{trialIdx, pairIdx, leftIsA, selected, confidence, rt}]
let current  = 0;
let selectedSide = null;  // 'left' | 'right'
let confidence   = 0;
let trialStart   = 0;

// ── 설정 화면 ──────────────────────────────────────────────────────
function addPair() {
  const idx = document.querySelectorAll('.pair-row-group').length;
  const wrap = document.getElementById('pairs-container');
  const div = document.createElement('div');
  div.className = 'pair-row-group';
  div.style.marginBottom = '12px';
  div.innerHTML = `
    <div style="font-size:0.78rem;color:#666;margin-bottom:4px;">쌍 ${idx + 1}</div>
    <div class="pair-row">
      <label>이미지 A</label>
      <input type="file" accept="image/*" onchange="onFileChange()" data-pair="${idx}" data-side="a">
      <span>vs</span>
      <label>이미지 B</label>
      <input type="file" accept="image/*" onchange="onFileChange()" data-pair="${idx}" data-side="b">
    </div>`;
  wrap.appendChild(div);
  pairs.push({ urlA: null, urlB: null, nameA: '', nameB: '' });
  checkReady();
}

function onFileChange() {
  const inputs = document.querySelectorAll('input[type=file][data-pair]');
  inputs.forEach(inp => {
    const pi = +inp.dataset.pair;
    const side = inp.dataset.side;
    if (inp.files && inp.files[0]) {
      pairs[pi][side === 'a' ? 'urlA' : 'urlB'] = URL.createObjectURL(inp.files[0]);
      pairs[pi][side === 'a' ? 'nameA' : 'nameB'] = inp.files[0].name;
    }
  });
  checkReady();
}

function checkReady() {
  const ok = pairs.length >= 1 && pairs.every(p => p.urlA && p.urlB);
  document.getElementById('start-btn').disabled = !ok;
}

// ── 실험 시작 ──────────────────────────────────────────────────────
function startStudy() {
  // Counterbalancing: 짝수 인덱스 → A 왼쪽, 홀수 인덱스 → B 왼쪽
  trials = pairs.map((_, i) => ({ pairIdx: i, leftIsA: (i % 2 === 0) }));
  // 순서 섞기 (Fisher-Yates)
  for (let i = trials.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [trials[i], trials[j]] = [trials[j], trials[i]];
  }
  document.getElementById('question-text').textContent =
    document.getElementById('question-input').value;
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('trial-screen').style.display = 'block';
  loadTrial(0);
}

// ── 트라이얼 로딩 ─────────────────────────────────────────────────
function loadTrial(idx) {
  current     = idx;
  selectedSide = null;
  confidence   = 0;
  trialStart   = performance.now();

  const t   = trials[idx];
  const p   = pairs[t.pairIdx];
  const total = trials.length;

  document.getElementById('progress-text').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(idx / total) * 100}%`;

  const leftUrl   = t.leftIsA ? p.urlA : p.urlB;
  const rightUrl  = t.leftIsA ? p.urlB : p.urlA;
  const leftLabel = t.leftIsA ? 'A' : 'B';
  const rightLabel = t.leftIsA ? 'B' : 'A';

  document.getElementById('img-left').src   = leftUrl;
  document.getElementById('img-right').src  = rightUrl;
  document.getElementById('label-left').textContent  = leftLabel;
  document.getElementById('label-right').textContent = rightLabel;

  ['opt-left','opt-right'].forEach(id => document.getElementById(id).classList.remove('selected'));
  document.querySelectorAll('.conf-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('next-btn');
  nb.classList.remove('ready');
}

// ── 선택 ──────────────────────────────────────────────────────────
function selectOption(side) {
  selectedSide = side;
  document.getElementById('opt-left').classList.toggle('selected', side === 'left');
  document.getElementById('opt-right').classList.toggle('selected', side === 'right');
  updateNextBtn();
}

function setConf(val) {
  confidence = val;
  document.querySelectorAll('.conf-btn').forEach((b, i) => {
    b.classList.toggle('active', i + 1 === val);
  });
  updateNextBtn();
}

function updateNextBtn() {
  const ready = selectedSide !== null && confidence > 0;
  document.getElementById('next-btn').classList.toggle('ready', ready);
}

// ── 다음 트라이얼 ─────────────────────────────────────────────────
function nextTrial() {
  if (!selectedSide || !confidence) return;
  const rt = ((performance.now() - trialStart) / 1000).toFixed(2);
  const t  = trials[current];

  // selectedSide 'left'|'right' → 어느 이미지를 골랐는지
  const selectedLabel = selectedSide === 'left'
    ? (t.leftIsA ? 'A' : 'B')
    : (t.leftIsA ? 'B' : 'A');

  results.push({
    trialIdx   : current,
    pairIdx    : t.pairIdx,
    leftIsA    : t.leftIsA,
    selected   : selectedLabel,   // 'A' or 'B'
    confidence : confidence,
    rt         : parseFloat(rt)
  });

  if (current + 1 < trials.length) {
    loadTrial(current + 1);
  } else {
    showResults();
  }
}

// ── 결과 화면 ─────────────────────────────────────────────────────
function showResults() {
  document.getElementById('trial-screen').style.display  = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('progress-fill').style.width   = '100%';

  const fresnelChosen = results.filter(r => r.selected === 'B').length;  // B = Fresnel
  const n = results.length;
  const pval = binomialPVal(fresnelChosen, n);

  document.getElementById('stat-fresnel').innerHTML =
    `Fresnel-guided(B) 선택: <span>${fresnelChosen} / ${n}</span>` +
    ` (${(fresnelChosen/n*100).toFixed(1)}%)`;
  document.getElementById('stat-total').innerHTML =
    `총 시행: <span>${n}</span>`;
  document.getElementById('stat-pval').innerHTML =
    `이항검정 p-value: <span>${pval < 0.001 ? '< 0.001' : pval.toFixed(3)}</span>` +
    (pval < 0.05 ? ' ✅ 유의 (α=0.05)' : ' ⚠️ 비유의');

  const tbody = document.getElementById('result-tbody');
  results.forEach((r, i) => {
    const p = pairs[r.pairIdx];
    const correct = r.selected === 'B';  // Fresnel = B
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td style="font-size:0.75rem;color:#888">${p.nameA} vs ${p.nameB}</td>
      <td>${r.leftIsA ? 'A (Baseline)' : 'B (Fresnel)'}</td>
      <td style="font-weight:700;color:${r.selected==='B'?'#4af77a':'#f77a7a'}">${r.selected}</td>
      <td>${correct ? '✅' : '❌'}</td>
      <td>${['','낮음','보통','높음'][r.confidence]}</td>
      <td>${r.rt}</td>`;
    tbody.appendChild(tr);
  });
}

// 이항검정 단측 p-value (H1: P(B) > 0.5)
function binomialPVal(k, n) {
  let p = 0;
  for (let i = k; i <= n; i++) p += binom(n, i) * Math.pow(0.5, n);
  return p;
}
function binom(n, k) {
  if (k < 0 || k > n) return 0;
  if (k === 0 || k === n) return 1;
  let r = 1;
  for (let i = 0; i < Math.min(k, n-k); i++) { r = r * (n-i) / (i+1); }
  return r;
}

// ── CSV 내보내기 ───────────────────────────────────────────────────
function exportCSV() {
  const header = 'trial,pair_idx,left_is_A,selected,chosen_fresnel,confidence,rt_sec\n';
  const rows = results.map(r =>
    `${r.trialIdx+1},${r.pairIdx},${r.leftIsA?1:0},${r.selected},${r.selected==='B'?1:0},${r.confidence},${r.rt}`
  ).join('\n');
  const blob = new Blob([header + rows], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `user_study_results_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// 초기 쌍 1개 자동 추가
addPair();
</script>
</body>
</html>
